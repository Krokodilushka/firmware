[env:kroko-c6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = pr
monitor_speed = 115200
; This board has an 8MB flash chip (the esp32-c6-devkitm-1 board def defaults to 4MB).
; Override the size + use the 8MB partition table for a much larger app partition.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partition-table-8MB.csv
build_flags =
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c6/kroko_c6
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  ; This board has no screen or audio hardware (see variant.h), so exclude those modules.
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  ; -DARDUINO_USB_CDC_ON_BOOT=1
  ; -DARDUINO_USB_MODE=1
  ; BLE on ESP32-C6 is provided by the bundled framework BLE library (libbt.a).
  ; Do NOT add h2zero/NimBLE-Arduino here: it ships a second copy of the NimBLE
  ; host (ble_gap.c etc.) and causes "multiple definition" link errors.
lib_deps =
  ${esp32c6_base.lib_deps}
  ; BMP580 pressure/temperature sensor (kroko_c6 private board only).
  ; Kept out of the shared [environmental_*] sections so it adds zero flash to other builds;
  ; the __has_include guard in BMP580Sensor.{h,cpp} enables the driver only here.
  # renovate: datasource=github-tags depName=SparkFun BMP581 packageName=sparkfun/SparkFun_BMP581_Arduino_Library
  https://github.com/sparkfun/SparkFun_BMP581_Arduino_Library/archive/refs/tags/v1.0.1.zip
  ; https://github.com/RobTillaart/INA226/archive/refs/tags/0.6.6.zip
lib_ignore =
  NonBlockingRTTTL
  libpax
  Adafruit INA219
  